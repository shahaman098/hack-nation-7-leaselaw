[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hackforge"
version = "0.5.0"
description = "Evidence-backed competition research and winning-idea search engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["competition", "hackathon", "ideation", "quality-diversity", "competition-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tenacity>=8.0",
  "eval_type_backport>=0.2; python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10,<2.3",
  "build>=1.2",
  "twine>=5.1",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
deepseek = ["litellm>=1.50"]
collision = [
  "litellm>=1.50",
  "datasets>=2.19",
  "huggingface_hub>=0.23",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "langfuse>=2.0",
  "numpy>=1.26",
]
all = ["hackforge[dev,openai,anthropic,deepseek,collision]"]

[project.scripts]
hackforge = "hackforge.cli:main"

[project.urls]
Homepage = "https://github.com/shahaman098/hackathon-strategy-engine"
Repository = "https://github.com/shahaman098/hackathon-strategy-engine"
Issues = "https://github.com/shahaman098/hackathon-strategy-engine/issues"
Changelog = "https://github.com/shahaman098/hackathon-strategy-engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackforge = ["py.typed"]

[tool.setuptools.data-files]
"share/hackforge/prompts/blind-judge" = ["prompts/blind-judge/v1.md"]
"share/hackforge/prompts/build-plan" = ["prompts/build-plan/v1.md"]
"share/hackforge/prompts/collision-audit" = ["prompts/collision-audit/v1.md"]
"share/hackforge/prompts/competition-research" = ["prompts/competition-research/v1.md"]
"share/hackforge/prompts/contrarian-ideation" = ["prompts/contrarian-ideation/v1.md"]
"share/hackforge/prompts/feasibility" = ["prompts/feasibility/v1.md"]
"share/hackforge/prompts/idea-crossing" = ["prompts/idea-crossing/v1.md"]
"share/hackforge/prompts/mechanism-mining" = ["prompts/mechanism-mining/v1.md"]
"share/hackforge/prompts/opportunity-discovery" = ["prompts/opportunity-discovery/v1.md"]
"share/hackforge/prompts/red-team" = ["prompts/red-team/v1.md"]
"share/hackforge/prompts/reflective-mutation" = ["prompts/reflective-mutation/v1.md"]
"share/hackforge/schemas" = ["schemas/*.json"]
"share/hackforge/fixtures" = ["fixtures/*.json", "fixtures/*.jsonl", "fixtures/*.md"]
"share/hackforge/corpora/crowded-archetypes" = ["corpora/crowded-archetypes/*.json"]
"share/hackforge/corpora/past-winners" = ["corpora/past-winners/reference-index.json"]
"share/hackforge/evals/benchmark-hackathons" = ["evals/benchmark-hackathons/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "slow: tests that download models or hit the network",
]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
files = ["src/hackforge"]
