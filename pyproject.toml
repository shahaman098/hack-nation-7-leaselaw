[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hackforge"
version = "0.2.0"
description = "HackForge: reproducible hackathon research and idea-selection laboratory"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tenacity>=8.0",
  "eval_type_backport>=0.2; python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
collision = [
  "litellm>=1.50",
  "datasets>=2.19",
  "huggingface_hub>=0.23",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "langfuse>=2.0",
  "numpy>=1.26",
]
all = ["hackforge[dev,openai,anthropic,collision]"]

[project.scripts]
hackforge = "hackforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hackforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
