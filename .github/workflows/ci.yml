name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leaselaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/leaselaw/requirements.txt

      - name: Install LeaseLaw
        run: pip install -r apps/leaselaw/requirements.txt

      - name: Eval harness (T1–T5)
        working-directory: apps/leaselaw
        run: python3 -m src.eval_harness

      - name: Pytest
        working-directory: apps/leaselaw
        run: python3 -m pytest -q tests
