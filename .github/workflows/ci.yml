name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy

      - name: Tests (fixture-isolated, no network/model downloads)
        env:
          HACKFORGE_USE_LITELLM: "0"
          HACKFORGE_USE_SENTENCE_TRANSFORMERS: "0"
          HACKFORGE_REQUIRE_SEMANTIC_COLLISION: "0"
        run: pytest -q -m "not slow"

  collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install semantic collision stack
        run: pip install -e ".[dev,collision]"
      - name: Build and query a real FAISS index
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: pytest -q tests/test_collision_stack.py::test_build_tiny_faiss_index

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Verify wheel contains runtime resources
        run: |
          python -m venv /tmp/hackforge-wheel
          /tmp/hackforge-wheel/bin/pip install dist/*.whl
          /tmp/hackforge-wheel/bin/hackforge --version
          /tmp/hackforge-wheel/bin/hackforge analyse --help
          /tmp/hackforge-wheel/bin/hackforge doctor
