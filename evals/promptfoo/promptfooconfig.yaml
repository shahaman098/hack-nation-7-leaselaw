description: HackForge baseline vs pipeline ideation (no idea-chatbot wrappers)
prompts:
- baseline.txt
- pipeline.txt
providers:
- id: openai:gpt-4o
  config:
    temperature: 0.4
tests:
- vars:
    brief: "# Sample Civic Resilience Hackathon 2026\n\nBuild tools that make public\
      \ services more reliable, fair, and understandable.\n\n## Tracks\n- Civic Data\n\
      - Accessibility\n- Public Admin Tooling\n\n## Sponsors\n- Example Cloud (managed\
      \ Postgres, object storage, serverless functions)\n- Open Data Alliance\n\n\
      ## Judging criteria\n- Technical implementation (high)\n- Real-world applicability\
      \ (high)\n- Originality (medium)\n- Design and demo clarity (medium)\n\n## Rules\n\
      - Teams of 1\u20134\n- 48-hour build window\n- Working demo required (footage\
      \ or live)\n- Open government datasets encouraged\n- Sponsor tech is optional\
      \ but rewarded when materially useful\n\n## What we do not want\n- Chatbot wrappers\n\
      - Dashboard-only visualisations without action\n- Generic productivity assistants\n"
  assert:
  - type: not-icontains
    value: wellness chatbot
  - type: not-icontains
    value: AI tutor
